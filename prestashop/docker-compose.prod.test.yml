version: '3'
services:
  mysql:
    container_name: prestashop-prod-test-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - prestashop_network
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prestashop:
    image: prestashop-app
    container_name: prestashop-prod-test-app
    build:
      context: .
      dockerfile: Docker/prestashop/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_ROOT_PASSWORD}
      DB_PREFIX: ${DB_PREFIX}
      PS_INSTALL_AUTO: 1
      PS_ERASE_DB: ${PS_ERASE_DB}
      PS_INSTALL_DB: ${PS_INSTALL_DB}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_LANGUAGE: ${PS_LANGUAGE}
      PS_COUNTRY: ${PS_COUNTRY}
      PS_ALL_LANGUAGES: 0
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL}
      ADMIN_MAIL: ${PS_ADMIN_MAIL}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWD}
      PS_ENABLE_SSL: ${PS_SSL}
      PS_HANDLE_DYNAMIC_DOMAIN: 0
      PS_DEMO_MODE: 0
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    networks:
      - prestashop_network

  nginx:
    image: prestashop-nginx
    container_name: prestashop-prod-test-nginx
    build:
      context: .
      dockerfile: Docker/nginx/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - prestashop
    ports:
      - "19795:443"
    networks:
      - prestashop_network

  memcached:
    image: memcached:alpine
    container_name: prestashop-prod-test-memcached
    restart: unless-stopped
    networks:
      - prestashop_network

networks:
  prestashop_network:

volumes:
  dbdata:
